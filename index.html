<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Trainers Course Agenda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Personal Trainers</p>
          <h1>Course Curriculum</h1>
        </div>
      </header>

      <main class="layout">
        <section class="agenda-panel" aria-labelledby="agenda-heading">
          <h2 id="agenda-heading" class="sr-only">Training meeting agenda</h2>
          <div class="agenda-list" id="agenda-list" aria-live="polite">
            <button class="agenda-item is-active" type="button" data-title="Human Anatomy Overview — Body Systems & Organs" data-description="Learn the foundation of the human body and how organ systems work together.">
              <span class="item-number">1</span>
              <span class="item-text">Human Anatomy Overview — Body Systems &amp; Organs</span>
            </button>

            <button class="agenda-item" type="button" data-title="The Musculoskeletal System — Structure &amp; Function" data-description="Explore bones, joints, and muscles that create movement and strength.">
              <span class="item-number">2</span>
              <span class="item-text">The Musculoskeletal System — Structure &amp; Function</span>
            </button>

            <button class="agenda-item" type="button" data-title="Muscles &amp; Deep Muscles" data-description="Study the major muscle groups and deeper stabilizing structures.">
              <span class="item-number">3</span>
              <span class="item-text">Muscles &amp; Deep Muscles</span>
            </button>

            <button class="agenda-item" type="button" data-title="Joints &amp; Movements in the Joints" data-description="Understand joint mechanics and movement patterns used in training.">
              <span class="item-number">4</span>
              <span class="item-text">Joints &amp; Movements in the Joints</span>
            </button>

            <button class="agenda-item" type="button" data-title="The Digestive System — Structure &amp; Function" data-description="Review digestion, nutrient absorption, and the body’s energy systems.">
              <span class="item-number">5</span>
              <span class="item-text">The Digestive System — Structure &amp; Function</span>
            </button>

            <button class="agenda-item review" type="button" data-title="CUMULATIVE REVIEW 1 (Meetings 1–5)" data-description="Review key ideas from the first five lessons and assess understanding.">
              <span class="item-number">6</span>
              <span class="item-text">CUMULATIVE REVIEW 1 (Meetings 1–5)</span>
            </button>

            <button class="agenda-item" type="button" data-title="Diets &amp; Alternative Diets" data-description="Explore nutrition approaches, eating patterns, and health considerations.">
              <span class="item-number">7</span>
              <span class="item-text">Diets &amp; Alternative Diets</span>
            </button>

            <button class="agenda-item" type="button" data-title="Elimination Diets &amp; Psychodietetics" data-description="Review individualized nutrition strategies and the psychology of eating.">
              <span class="item-number">8</span>
              <span class="item-text">Elimination Diets &amp; Psychodietetics</span>
            </button>

            <button class="agenda-item" type="button" data-title="Fitness — Concepts, Components &amp; Assessment" data-description="Learn how fitness is measured and classified across body systems.">
              <span class="item-number">9</span>
              <span class="item-text">Fitness — Concepts, Components &amp; Assessment</span>
            </button>

            <button class="agenda-item" type="button" data-title="Nutrition in Sport" data-description="Connect nutrition to performance, recovery, and training demands.">
              <span class="item-number">10</span>
              <span class="item-text">Nutrition in Sport</span>
            </button>

            <button class="agenda-item" type="button" data-title="Supplementation in Sport" data-description="Examine supplementation benefits, risks, and evidence-based use.">
              <span class="item-number">11</span>
              <span class="item-text">Supplementation in Sport</span>
            </button>

            <button class="agenda-item review" type="button" data-title="CUMULATIVE REVIEW 2 (Meetings 7–11)" data-description="Test knowledge across nutrition, fitness, and coaching foundations.">
              <span class="item-number">12</span>
              <span class="item-text">CUMULATIVE REVIEW 2 (Meetings 7–11)</span>
            </button>

            <button class="agenda-item" type="button" data-title="Exercise Technique — Lower Body (Squats, Deadlift, Hip Thrust)" data-description="Practice lower-body exercise mechanics and performance emphasis.">
              <span class="item-number">13</span>
              <span class="item-text">Exercise Technique — Lower Body (Squats, Deadlift, Hip Thrust)</span>
            </button>

            <button class="agenda-item" type="button" data-title="Exercise Technique — Upper Body &amp; Core (Push-ups, Crunches, Planks, Rowing, Chin-ups)" data-description="Build technique and stability for upper-body and trunk movements.">
              <span class="item-number">14</span>
              <span class="item-text">Exercise Technique — Upper Body &amp; Core (Push-ups, Crunches, Planks, Rowing, Chin-ups)</span>
            </button>

            <button class="agenda-item" type="button" data-title="Exercise Technique — Plyometrics &amp; Dynamic Movements (Jumps &amp; More)" data-description="Improve power and dynamic coordination through explosive movement work.">
              <span class="item-number">15</span>
              <span class="item-text">Exercise Technique — Plyometrics &amp; Dynamic Movements (Jumps &amp; More)</span>
            </button>

            <button class="agenda-item" type="button" data-title="The Circulatory System — Structure &amp; Function" data-description="Understand cardiovascular flow, oxygen delivery, and function during exercise.">
              <span class="item-number">16</span>
              <span class="item-text">The Circulatory System — Structure &amp; Function</span>
            </button>

            <button class="agenda-item" type="button" data-title="The Respiratory System — Structure &amp; Function" data-description="Study breathing mechanics and the body’s oxygen exchange process.">
              <span class="item-number">17</span>
              <span class="item-text">The Respiratory System — Structure &amp; Function</span>
            </button>

            <button class="agenda-item review" type="button" data-title="CUMULATIVE REVIEW 3 (Meetings 13–17)" data-description="Integrate the anatomy, technique, and system concepts covered so far.">
              <span class="item-number">18</span>
              <span class="item-text">CUMULATIVE REVIEW 3 (Meetings 13–17)</span>
            </button>

            <button class="agenda-item" type="button" data-title="Chronic Diseases — Causes &amp; Risk Factors" data-description="Review disease prevention and factors that affect long-term health.">
              <span class="item-number">19</span>
              <span class="item-text">Chronic Diseases — Causes &amp; Risk Factors</span>
            </button>

            <button class="agenda-item" type="button" data-title="Chronic Diseases — Management &amp; Exercise" data-description="Evaluate exercise and lifestyle interventions for chronic disease management.">
              <span class="item-number">20</span>
              <span class="item-text">Chronic Diseases — Management &amp; Exercise</span>
            </button>

            <button class="agenda-item" type="button" data-title="Types of Training — Functional, Speed &amp; Endurance" data-description="Define key training styles and their impact on movement quality and performance.">
              <span class="item-number">21</span>
              <span class="item-text">Types of Training — Functional, Speed &amp; Endurance</span>
            </button>

            <button class="agenda-item" type="button" data-title="Types of Training — Flexibility &amp; Others" data-description="Explore mobility, flexibility, and complementary methods for balanced programming.">
              <span class="item-number">22</span>
              <span class="item-text">Types of Training — Flexibility &amp; Others</span>
            </button>

            <button class="agenda-item" type="button" data-title="Training Methods" data-description="Compare structured training methods for different client goals and populations.">
              <span class="item-number">23</span>
              <span class="item-text">Training Methods</span>
            </button>

            <button class="agenda-item review" type="button" data-title="CUMULATIVE REVIEW 4 (Meetings 19–23)" data-description="Summarize chronic disease, training methods, and practical application.">
              <span class="item-number">24</span>
              <span class="item-text">CUMULATIVE REVIEW 4 (Meetings 19–23)</span>
            </button>

            <button class="agenda-item" type="button" data-title="First Aid — Emergencies (Choking, CPR, Unconsciousness)" data-description="Prepare for emergency response and basic life-support situations.">
              <span class="item-number">25</span>
              <span class="item-text">First Aid — Emergencies (Choking, CPR, Unconsciousness)</span>
            </button>

            <button class="agenda-item" type="button" data-title="First Aid — Injuries &amp; Recovery (Sprains, Wounds, Recovery Position)" data-description="Apply first-aid principles for common sports injuries and safe recovery practices.">
              <span class="item-number">26</span>
              <span class="item-text">First Aid — Injuries &amp; Recovery (Sprains, Wounds, Recovery Position)</span>
            </button>
          </div>
        </section>

          <div class="panel-card">

              Learn the foundation of the human body and how organ systems work together.

              <span class="placeholder-label">Interactive activity</span>

            </div>
          </div>
